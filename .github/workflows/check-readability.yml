name: Readability

# Only the content being measured and the tool doing the measuring can change
# the result, so the job is scoped to those paths.
on:
  merge_group:
  pull_request:
    paths:
      - content/**
      - scripts/readability/**
      - .github/workflows/check-readability.yml
  push:
    branches: [main]
    paths:
      - content/**
      - scripts/readability/**
      - .github/workflows/check-readability.yml

jobs:
  readability:
    name: READABILITY report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The tool has no dependencies, so there is nothing to install.
      - name: Test the analyzer
        run: npm run test:readability

      - name: Report content readability
        run: |
          npm run -s check:readability -- --format markdown >>"$GITHUB_STEP_SUMMARY"
